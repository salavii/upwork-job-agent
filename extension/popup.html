<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Upwork Job Grabber</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      width: 240px;
      padding: 14px;
      margin: 0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px 0;
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #f2f2f2;
    }
    button:hover {
      background-color: #e6e6e6;
    }
    button:disabled {
      cursor: default;
      opacity: 0.6;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 16px;
    }
    #status.success {
      color: #1b8a3d;
    }
    #status.error {
      color: #c53030;
    }
  </style>
</head>
<body>
  <h1>Upwork Job Grabber</h1>
  <button id="save-button">Save this job</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
